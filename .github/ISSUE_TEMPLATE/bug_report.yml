name: Bug report
description: Something the extension did that it should not have
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before you paste anything:** run `Sensible Defaults: Copy Diagnostics for Support`
        from the command palette and paste that below. It redacts your key.
        Do not paste `settings.json` by hand: it contains your Bedrock API key.

        Anything involving a way for your key to end up somewhere it should not be
        goes to **security@cutler.sg**, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the panel showed, or what the command did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of "Copy Diagnostics for Support". Your key is already replaced with «redacted».
      render: text
    validations:
      required: true
  - type: dropdown
    id: remote
    attributes:
      label: Where Claude Code runs
      description: The bottom-left corner of the VS Code window says which.
      options:
        - Local window (no remote)
        - WSL
        - Remote-SSH
        - Dev container
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1, Windows 11 24H2, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version
      placeholder: Help → About
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: The diagnostics above came from the Copy Diagnostics command, not a hand-pasted settings file.
          required: true
