name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # The federated credential on the publishing identity trusts this
    # environment, not a branch or tag: a tag-scoped credential matches one
    # exact tag and breaks on the next release, since Entra does no pattern
    # matching on the subject. The environment's own policy limits it to `v*`.
    environment: marketplace-publish
    # Secrets cannot be referenced directly in `if:`, so surface them as job-level env.
    env:
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # VS Code's convention: an even minor is a stable release, an odd minor a
      # pre-release. A published version cannot change channel afterwards, so the
      # tag alone decides it here and must agree with package.json.
      - name: Resolve release channel
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $manifest"
            exit 1
          fi
          minor="$(echo "$version" | cut -d. -f2)"
          if [ $((minor % 2)) -eq 1 ]; then
            echo "PRE_RELEASE_FLAG=--pre-release" >> "$GITHUB_ENV"
            echo "::notice::$version publishes to the pre-release channel (odd minor)"
          else
            echo "::notice::$version publishes as a stable release (even minor)"
          fi

      - name: Package
        run: bun run package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      # Azure DevOps retires global PATs on 2026-12-01; publish via Entra workload
      # identity federation from the outset (PRD §8).
      # The identity is a user-assigned managed identity holding no role on any
      # subscription: it exists only to be a Marketplace publisher member, and
      # `vsce` asks it for an Azure DevOps token, never an ARM one. Without
      # `allow-no-subscriptions` the login step would fail looking for one.
      - name: Azure login (OIDC)
        if: ${{ env.HAS_AZURE == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        if: ${{ env.HAS_AZURE == 'true' }}
        run: bunx vsce publish --azure-credential $PRE_RELEASE_FLAG --no-dependencies

      - name: Publish to Open VSX
        if: ${{ env.HAS_OVSX == 'true' }}
        run: bunx ovsx publish $PRE_RELEASE_FLAG -p "${{ secrets.OVSX_PAT }}"
