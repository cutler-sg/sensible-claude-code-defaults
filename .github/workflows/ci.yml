name: CI

on:
  push:
    # Diagnostic branches run their own bounded workflow; the full matrix
    # there only adds a hanging macOS leg to the queue.
    branches: ["**", "!diag/**"]
  # `synchronize` is deliberately absent: a new commit on a PR branch already
  # fires the push trigger, and listening for both ran the whole matrix twice
  # per commit — two macOS runners to learn one thing.
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

# A push supersedes the run before it. Without this a hung leg keeps a runner
# (and a macOS one at that) busy long after its commit stopped mattering.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit suite is filesystem-heavy and platform-parameterised (workspace
  # guard, mode/ACL repair, path resolution), so most platform risk is reachable
  # without an extension host. The extension-host smoke runs on every leg too:
  # Windows is the one most likely to surface a path or ACL bug.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Electron needs a display; only Linux lacks one on a CI runner.
      - name: Integration test (extension host)
        run: xvfb-run -a bun run test:integration
        if: runner.os == 'Linux'

      # Bounded and non-blocking on macOS while the host hang there is open:
      # a redirected HOME stops the Electron host before the first test. It is
      # not a required check; the point of the bound is to stop each push
      # holding a macOS runner for twenty minutes and starving the queue.
      # Tracked on the diag/macos-host-hang branch.
      - name: Integration test (extension host)
        run: bun run test:integration
        if: runner.os != 'Linux'
        timeout-minutes: ${{ runner.os == 'macOS' && 6 || 15 }}
        continue-on-error: ${{ runner.os == 'macOS' }}

  # A Linux leg with no secret-service daemon and no libsecret: Q-X promised the
  # keychain failure is *reported*, not swallowed, and nothing had tested it.
  # `dbus-run-session` is deliberately absent here — the point is the degraded box.
  headless-linux:
    name: test (linux, no keyring)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert no secret service is reachable
        run: |
          if [ -n "${DBUS_SESSION_BUS_ADDRESS:-}" ]; then
            echo "A session bus is set; this leg must run without one." >&2
            exit 1
          fi

      - name: Integration test (degraded keychain)
        run: xvfb-run -a bun run test:integration

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package
        run: bun run package

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
